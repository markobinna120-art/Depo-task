<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkTasks - Fixed</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:80px}
.header{background:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:20px}.logo span{color:#ffb400}
.balance-card{background:#fff8dc;border-radius:15px;padding:20px;margin:15px}
.btn-black{background:#0a1931;color:#fff;border:none;padding:12px 20px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{padding:8px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.tab.active{background:#0a1931;color:#fff}
.panel{background:#fff;border-radius:10px;padding:15px;margin-top:10px;display:none}
.panel.active{display:block}
.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.social-bar{display:flex;gap:15px;justify-content:center;padding:20px;background:#fff;margin:15px;border-radius:10px}
.social-bar i{font-size:28px}
.fa-facebook{color:#1877f2}.fa-whatsapp{color:#25D366}.fa-instagram{color:#E4405F}.fa-twitter{color:#1DA1F2}.fa-tiktok{color:#000}.fa-telegram{color:#0088cc}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
</style>
</head>
<body>
<div class="header"><div class="logo">Mark<span>Tasks</span></div><div><small>Mark 👑</small></div></div>
<div class="balance-card"><h4>AVAILABLE BALANCE</h4><h1 id="bal">₦0</h1><button class="btn-black" onclick="showDeposit()">Deposit</button><button class="btn-black" style="margin-top:8px;background:#fff;color:#0a1931;border:1px solid #0a1931" onclick="alert('Withdraw - Bal: ₦'+users[0].balance)">Withdraw</button></div>

<div class="social-bar">
<a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
<a href="https://wa.me/2340000000000" target="_blank"><i class="fab fa-whatsapp"></i></a>
<a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
<a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
<a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
<a href="https://telegram.me" target="_blank"><i class="fab fa-telegram"></i></a>
</div>

<div style="padding:15px"><h3>👑 Admin</h3>
<div class="tabs">
<div class="tab active" id="tab-users" onclick="openTab('users')">Users (<span id="uc">1</span>)</div>
<div class="tab" id="tab-deposits" onclick="openTab('deposits')">Deposits (<span id="dc">0</span>)</div>
<div class="tab" id="tab-tasks" onclick="openTab('tasks')">Tasks (<span id="tc">0</span>)</div>
<div class="tab" id="tab-proofs" onclick="openTab('proofs')">Proofs</div>
</div>
<div id="users" class="panel active"><div id="usersList"></div></div>
<div id="deposits" class="panel"><h4>Pending Deposits - Click Approve</h4><div id="depList"></div></div>
<div id="tasks" class="panel"><input id="taskTitle" placeholder="Task Title"><select id="taskPlatform"><option>Facebook</option><option>Instagram</option><option>Twitter</option><option>TikTok</option><option>WhatsApp</option><option>Telegram</option></select><input id="taskReward" type="number" placeholder="Reward"><button class="btn-black" onclick="addTask()">Add Task</button><div id="tasksList"></div></div>
<div id="proofs" class="panel">No proofs yet</div>
</div>

<div id="depModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);padding:20px;align-items:center;justify-content:center"><div style="background:#fff;padding:20px;border-radius:10px;width:100%;max-width:350px"><h3>Deposit</h3><input id="depAmount" type="number" placeholder="Amount"><select id="depMethod"><option>Bank Transfer</option><option>Opay</option><option>Palmpay</option></select><p style="font-size:12px">Send to: 1234567890 - MarkTasks</p><button class="btn-black" onclick="submitDeposit()">Submit</button><button class="btn-black" style="background:#ccc;color:#000;margin-top:5px" onclick="closeDeposit()">Cancel</button></div></div>

<script>
let users = JSON.parse(localStorage.getItem('mt_users')||'[{"id":1,"name":"Mark","balance":0}]');
let deposits = JSON.parse(localStorage.getItem('mt_deps')||'[]');
let tasks = JSON.parse(localStorage.getItem('mt_tasks')||'[]');
function save(){localStorage.setItem('mt_users',JSON.stringify(users));localStorage.setItem('mt_deps',JSON.stringify(deposits));localStorage.setItem('mt_tasks',JSON.stringify(tasks));updateUI()}
function openTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('tab-'+id).classList.add('active');}
function updateUI(){document.getElementById('bal').innerText='₦'+(users[0].balance||0);document.getElementById('uc').innerText=users.length;document.getElementById('dc').innerText=deposits.filter(d=>d.status==='pending').length;document.getElementById('tc').innerText=tasks.length;renderUsers();renderDeps();renderTasks();}
function renderUsers(){document.getElementById('usersList').innerHTML=users.map(u=>`<div class="item"><div><b>${u.name}</b><br><small>₦${u.balance}</small></div><button style="background:#0a1931;color:#fff;border:none;padding:8px 12px;border-radius:6px" onclick="fundUser(${u.id})">Fund</button></div>`).join('');}
function renderDeps(){if(deposits.length===0){document.getElementById('depList').innerHTML='<p>No deposits</p>';return}document.getElementById('depList').innerHTML=deposits.map((d,i)=>`<div class="item"><div><b>₦${d.amount}</b> - ${d.method}<br><small>${d.status}</small></div><div>${d.status==='pending'?`<button style="background:#0a1931;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="approveDep(${i})">Approve</button> <button style="background:red;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="rejectDep(${i})">Reject</button>`:d.status}</div></div>`).join('');}
function renderTasks(){document.getElementById('tasksList').innerHTML=tasks.map((t,i)=>`<div class="item"><div><i class="fab fa-${t.platform.toLowerCase()}"></i> ${t.title} - ₦${t.reward}</div><button style="background:red;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="delTask(${i})">Del</button></div>`).join('');}
function showDeposit(){document.getElementById('depModal').style.display='flex'}
function closeDeposit(){document.getElementById('depModal').style.display='none'}
function submitDeposit(){let amt=parseInt(document.getElementById('depAmount').value);if(!amt){alert('Enter amount');return}deposits.push({amount:amt,method:document.getElementById('depMethod').value,status:'pending'});save();closeDeposit();alert('Deposit submitted! Now go to Admin > Deposits > Approve');}
function approveDep(i){users[0].balance+=deposits[i].amount;deposits[i].status='approved';save();alert('Approved!');}
function rejectDep(i){deposits[i].status='rejected';save()}
function fundUser(id){let amt=prompt('Amount:');if(amt){users.find(u=>u.id===id).balance+=parseInt(amt);save()}}
function addTask(){let t=document.getElementById('taskTitle').value,p=document.getElementById('taskPlatform').value,r=document.getElementById('taskReward').value;if(!t||!r){alert('Fill');return}tasks.push({title:t,platform:p,reward:r});save();document.getElementById('taskTitle').value='';document.getElementById('taskReward').value='';}
function delTask(i){tasks.splice(i,1);save()}
updateUI();
</script>
</body>
  </html>
