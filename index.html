<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MarkTasks</title><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f6f6f7}.top{display:flex;justify-content:space-between;padding:14px 16px;background:#fff;position:sticky;top:0}.logo{font-weight:800;font-size:20px}.logo span{color:#f59e0b}.card{background:#fff9db;margin:12px;border-radius:18px;padding:18px;border:1px solid #fde68a}.bal{font-size:13px;font-weight:700}.amt{font-size:32px;font-weight:900;margin:4px 0 12px}.btn-dark{width:100%;background:#0f172a;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:700;margin:6px 0;cursor:pointer}.btn-light{width:100%;background:#fff;color:#0f172a;border:1.5px solid #0f172a;padding:12px;border-radius:12px;font-weight:700;margin:6px 0}.social{display:flex;gap:12px;justify-content:center;background:#fff;margin:12px;border-radius:14px;padding:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:600;font-size:13px}.tab.active{background:#0f172a;color:#fff}.user-row{background:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin:8px 0;border:1px solid #eee}.auth{display:flex;min-height:100vh;align-items:center;justify-content:center;background:#fff9db;padding:20px}.auth-box{background:#fff;padding:22px;border-radius:16px;width:100%;max-width:380px}.auth-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}.pop{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;z-index:9999}</style></head><body><div id="app"></div><script>
const SERVICE_ID="service_xxxxx";const TEMPLATE_ID="template_xxxxx";const PUBLIC_KEY="xxxxxxxxxxxx";emailjs.init(PUBLIC_KEY);
let db=JSON.parse(localStorage.getItem('mt_db')||'{"u":[],"cu":null,"deps":[]}');let cur=db.u.find(x=>x.id===db.cu)||null;let pendingUser=null,pendingOTP=null,admTab='users';
function save(){localStorage.setItem('mt_db',JSON.stringify(db))}function showPop(t){let d=document.createElement('div');d.className='pop';d.innerText=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function showSignup(){document.getElementById('app').innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>MarkTasks Signup</h2><input id=sn placeholder=Full Name><input id=se placeholder=Real Email type=email><input id=sp placeholder=Password type=password><button id=signupBtn class=btn-dark onclick=sendOTP(false)>Send Real Code</button><center><br><small onclick=showLogin()>Have account? <b>Login</b></small><div id=otpStatus style=margin-top:10px;font-size:12px></div></center></div></div>`;}
function showLogin(){document.getElementById('app').innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>Login</h2><input id=le placeholder=Email type=email><input id=lp placeholder=Password type=password><button class=btn-dark onclick=doLogin()>Login</button><center><br><small onclick=showSignup()>No account? <b>Signup</b></small></center></div></div>`;}
function doLogin(){let e=document.getElementById('le').value.toLowerCase().trim();let p=document.getElementById('lp').value;let u=db.u.find(x=>x.email===e&&x.password===p);if(!u){alert('Wrong');return}db.cu=u.id;cur=u;save();main();}
function logout(){db.cu=null;save();cur=null;showLogin()}
async function sendOTP(isResend){let n=isResend?pendingUser.name:document.getElementById("sn").value;let e=isResend?pendingUser.email:document.getElementById("se").value.toLowerCase().trim();let p=isResend?pendingUser.password:document.getElementById("sp").value;if(!n||!e||!p){alert("Fill all");return}if(!e.includes("@")){alert("Valid email");return}if(!isResend&&db.u.find(x=>x.email===e)){alert("Exists");return}if(SERVICE_ID.includes("xxxxx")){alert("Set EmailJS IDs at top");return}pendingOTP=Math.floor(100000+Math.random()*900000).toString();pendingUser={id:Date.now(),name:n,email:e,password:p,bal:0};let st=document.getElementById("otpStatus");if(st)st.innerHTML="Sending to "+e+"...";document.getElementById("signupBtn").disabled=true;try{await emailjs.send(SERVICE_ID,TEMPLATE_ID,{to_name:n,to_email:e,otp_code:pendingOTP,email:e});showPop("Code sent to "+e);showOTPFormReal();}catch(err){alert("Failed: "+(err.text||err));document.getElementById("signupBtn").disabled=false;}}
function showOTPFormReal(){document.getElementById('app').innerHTML=`<div class=auth><div class=auth-box><h2 style=text-align:center>Enter Real Code</h2><p style=text-align:center;font-size:13px>We sent 6-digit code to<br><b>${pendingUser.email}</b><br><small style=color:red>Check Spam!</small></p><input id=otpInput style=letter-spacing:8px;text-align:center;font-size:20px;font-weight:800;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0 maxlength=6 placeholder=000000><button class=btn-dark onclick=verifyOTPReal()>Verify</button><center><br><small onclick="pendingUser=null;showSignup()">Go Back</small><br><br><small onclick="sendOTP(true)" style=color:#6366f1>Resend</small></center><div id=otpStatus style=text-align:center;margin-top:8px;font-size:12px;color:#ef4444></div></div></div>`;}
function verifyOTPReal(){let code=document.getElementById("otpInput").value.trim();if(code!==pendingOTP){document.getElementById("otpStatus").innerText="Wrong code";return;}db.u.push(pendingUser);db.cu=pendingUser.id;cur=pendingUser;save();pendingUser=null;pendingOTP=null;showPop("Verified!");main();}
function main(){if(!cur){showLogin();return;}document.getElementById('app').innerHTML=`<div class=top><div class=logo>Mark<span>Tasks</span></div><div onclick=logout()>${cur.name} 👋</div></div><div class=card><div class=bal>AVAILABLE BALANCE</div><div class=amt>₦${cur.bal}</div><button class=btn-dark onclick=deposit()>Deposit</button><button class=btn-light onclick=withdraw()>Withdraw</button></div><div class=social><a href=#>📘</a><a href=#>🟢</a><a href=#>📷</a><a href=#>🐦</a><a href=#>🎵</a><a href=#>✈️</a></div><div style=padding:12px><div style=font-weight:800>👑 Admin</div><div class=tabs><div class="tab ${admTab==='users'?'active':''}" onclick="admTab='users';main()">Users (${db.u.length})</div><div class="tab ${admTab==='deps'?'active':''}" onclick="admTab='deps';main()">Deposits (${db.deps.length})</div><div class=tab>Tasks (0)</div><div class=tab>Proofs</div></div><div id=admContent></div></div>`;renderAdmin();}
function renderAdmin(){let c=document.getElementById('admContent');if(admTab==='users'){c.innerHTML=db.u.map(u=>`<div class=user-row><div><b>${u.name}</b><br>₦${u.bal}</div><button class=btn-dark style=width:auto;padding:8px 14px onclick=fund(${u.id})>Fund</button></div>`).join('');}else{c.innerHTML=db.deps.length?db.deps.map(d=>`<div class=user-row><div>${d.email} - ₦${d.amt}</div><small>${d.status}</small></div>`).join(''):'<p>No deposits</p>';}}
function deposit(){let a=prompt("Enter amount:");if(!a)return;a=Number(a);if(!a||a<100){alert("Min 100");return}db.deps.push({id:Date.now(),email:cur.email,amt:a,status:'Pending',userId:cur.id});save();showPop("Deposit request sent");main();}
function fund(id){let u=db.u.find(x=>x.id===id);let a=prompt("Fund amount for "+u.name);if(!a)return;a=Number(a);u.bal+=a;if(cur.id===u.id)cur.bal=u.bal;save();main();showPop("Funded ₦"+a);}
function withdraw(){let a=prompt("Withdraw - Bal: ₦"+cur.bal);if(!a)return;a=Number(a);if(a>cur.bal){alert("Insufficient");return}cur.bal-=a;db.u.find(x=>x.id===cur.id).bal=cur.bal;save();main();showPop("Withdraw sent");}
if(cur)main();else showLogin();
</script></body></html><a href="https://telegram.me" target="_blank"><i class="fab fa-telegram"></i></a>
</div>

<div style="padding:15px"><h3>👑 Admin</h3>
<div class="tabs">
<div class="tab active" id="tab-users" onclick="openTab('users')">Users (<span id="uc">1</span>)</div>
<div class="tab" id="tab-deposits" onclick="openTab('deposits')">Deposits (<span id="dc">0</span>)</div>
<div class="tab" id="tab-tasks" onclick="openTab('tasks')">Tasks (<span id="tc">0</span>)</div>
<div class="tab" id="tab-proofs" onclick="openTab('proofs')">Proofs</div>
</div>
<div id="users" class="panel active"><div id="usersList"></div></div>
<div id="deposits" class="panel"><h4>Pending Deposits - Click Approve</h4><div id="depList"></div></div>
<div id="tasks" class="panel"><input id="taskTitle" placeholder="Task Title"><select id="taskPlatform"><option>Facebook</option><option>Instagram</option><option>Twitter</option><option>TikTok</option><option>WhatsApp</option><option>Telegram</option></select><input id="taskReward" type="number" placeholder="Reward"><button class="btn-black" onclick="addTask()">Add Task</button><div id="tasksList"></div></div>
<div id="proofs" class="panel">No proofs yet</div>
</div>

<div id="depModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);padding:20px;align-items:center;justify-content:center"><div style="background:#fff;padding:20px;border-radius:10px;width:100%;max-width:350px"><h3>Deposit</h3><input id="depAmount" type="number" placeholder="Amount"><select id="depMethod"><option>Bank Transfer</option><option>Opay</option><option>Palmpay</option></select><p style="font-size:12px">Send to: 1234567890 - MarkTasks</p><button class="btn-black" onclick="submitDeposit()">Submit</button><button class="btn-black" style="background:#ccc;color:#000;margin-top:5px" onclick="closeDeposit()">Cancel</button></div></div>

<script>
let users = JSON.parse(localStorage.getItem('mt_users')||'[{"id":1,"name":"Mark","balance":0}]');
let deposits = JSON.parse(localStorage.getItem('mt_deps')||'[]');
let tasks = JSON.parse(localStorage.getItem('mt_tasks')||'[]');
function save(){localStorage.setItem('mt_users',JSON.stringify(users));localStorage.setItem('mt_deps',JSON.stringify(deposits));localStorage.setItem('mt_tasks',JSON.stringify(tasks));updateUI()}
function openTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('tab-'+id).classList.add('active');}
function updateUI(){document.getElementById('bal').innerText='₦'+(users[0].balance||0);document.getElementById('uc').innerText=users.length;document.getElementById('dc').innerText=deposits.filter(d=>d.status==='pending').length;document.getElementById('tc').innerText=tasks.length;renderUsers();renderDeps();renderTasks();}
function renderUsers(){document.getElementById('usersList').innerHTML=users.map(u=>`<div class="item"><div><b>${u.name}</b><br><small>₦${u.balance}</small></div><button style="background:#0a1931;color:#fff;border:none;padding:8px 12px;border-radius:6px" onclick="fundUser(${u.id})">Fund</button></div>`).join('');}
function renderDeps(){if(deposits.length===0){document.getElementById('depList').innerHTML='<p>No deposits</p>';return}document.getElementById('depList').innerHTML=deposits.map((d,i)=>`<div class="item"><div><b>₦${d.amount}</b> - ${d.method}<br><small>${d.status}</small></div><div>${d.status==='pending'?`<button style="background:#0a1931;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="approveDep(${i})">Approve</button> <button style="background:red;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="rejectDep(${i})">Reject</button>`:d.status}</div></div>`).join('');}
function renderTasks(){document.getElementById('tasksList').innerHTML=tasks.map((t,i)=>`<div class="item"><div><i class="fab fa-${t.platform.toLowerCase()}"></i> ${t.title} - ₦${t.reward}</div><button style="background:red;color:#fff;border:none;padding:6px 10px;border-radius:5px" onclick="delTask(${i})">Del</button></div>`).join('');}
function showDeposit(){document.getElementById('depModal').style.display='flex'}
function closeDeposit(){document.getElementById('depModal').style.display='none'}
function submitDeposit(){let amt=parseInt(document.getElementById('depAmount').value);if(!amt){alert('Enter amount');return}deposits.push({amount:amt,method:document.getElementById('depMethod').value,status:'pending'});save();closeDeposit();alert('Deposit submitted! Now go to Admin > Deposits > Approve');}
function approveDep(i){users[0].balance+=deposits[i].amount;deposits[i].status='approved';save();alert('Approved!');}
function rejectDep(i){deposits[i].status='rejected';save()}
function fundUser(id){let amt=prompt('Amount:');if(amt){users.find(u=>u.id===id).balance+=parseInt(amt);save()}}
function addTask(){let t=document.getElementById('taskTitle').value,p=document.getElementById('taskPlatform').value,r=document.getElementById('taskReward').value;if(!t||!r){alert('Fill');return}tasks.push({title:t,platform:p,reward:r});save();document.getElementById('taskTitle').value='';document.getElementById('taskReward').value='';}
function delTask(i){tasks.splice(i,1);save()}
updateUI();
</script>
</body>
  </html>
